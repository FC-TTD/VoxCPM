services:
  demo:
    image: voxcpm-demo:latest
    container_name: voxcpm-demo
    environment:
      - TZ=Asia/Shanghai
      - NVIDIA_VISIBLE_DEVICES=0
      - GRADIO_SERVER_NAME=0.0.0.0
      - HF_REPO_ID=openbmb/VoxCPM2
      - VOXCPM_MODEL_DIR=/app/models/openbmb__VoxCPM2
    command: ["bash", "-lc", "ln -sfn /TTD-Data/voxcpm/models /app/models && python app.py --port 8808"]
    ports:
      - "6861:8808"
    volumes:
      - /TTD-Data/voxcpm:/TTD-Data/voxcpm
      - /TTD-Data/voxcpm/local:/root/.local
      - /TTD-Data/voxcpm/cache:/root/.cache
    restart: unless-stopped
    networks:
      - caddy

networks:
  caddy:
    external: true
